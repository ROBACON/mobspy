name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v3.0.0rc1)
        required: true
        type: string
      confirm_publish:
        description: Type RELEASE to publish to PyPI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate manual release request
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm_publish }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$CONFIRM" != RELEASE ]; then
            echo "Manual release requires confirm_publish=RELEASE" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "setuptools-scm>=9,<10"
      - name: Require an existing tag on main
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tagged_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          echo "sha=$tagged_commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Check package version
        id: version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  publish-pypi:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mobspy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [validate, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          options=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${options[@]}"
