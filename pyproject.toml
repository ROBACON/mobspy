[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mobspy"
version = "2.8.0"
description = "A Query-Based Language for Chemical Reaction Networks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["CRN", "microbiology", "synthetic biology", "simulation", "SBML", "specification language"]
dependencies = [
    "matplotlib>=3,<4",
    "numpy>=1.20,<3",
    "python-copasi~=4.44",
    "python-libsbml>=5,<6",
    "scipy>=1,<2",
    "pandas>=1,<3",
    "joblib>=1,<2",
    "tqdm>=4,<5",
    "copasi-basico~=0.75",
    "pint>=0.23,<1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pyyaml"]
docs = ["sphinx>=7.0", "myst-parser", "sphinx-rtd-theme", "nbsphinx", "pygments"]

[project.urls]
Repository = "https://github.com/ROBACON/mobspy"
Documentation = "https://mobspy-doc.readthedocs.io/en/latest/"

[tool.setuptools.packages.find]
include = ["mobspy", "mobspy.*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",             # pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "A",             # flake8-builtins
    "SIM",           # flake8-simplify
    # TCH (flake8-type-checking) disabled: codebase uses re-export patterns
    # and circular imports that TCH cannot safely handle
    "RUF",           # ruff-specific
    "S",             # flake8-bandit (security)
    "C4",            # flake8-comprehensions
    "PT",            # flake8-pytest-style
    "RET",           # flake8-return
    "ARG",           # flake8-unused-arguments
    "PTH",           # flake8-use-pathlib
    "ERA",           # eradicate (commented-out code)
    "PL",            # pylint subset
    "PERF",          # perflint
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "F405", "F841", "B018", "B011", "B015", "S", "ARG", "ERA", "PLR", "PT", "PLC0415", "E501", "E731", "N", "A001", "RUF059"]
"docs/**" = ["F403", "F405", "F401", "E501", "E731", "E741", "I001", "B018", "S", "ARG", "ERA", "T20", "N", "A001", "PLR", "PLC0415", "PLC0206", "F821", "W291", "B007", "C408", "SIM108", "SIM117", "RUF005"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
    "slow: tests that run simulations (may take a while)",
    "compilation: tests that only compile models (fast)",
]

[tool.coverage.run]
source = ["mobspy"]

[tool.coverage.report]
show_missing = true
fail_under = 60
