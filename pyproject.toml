[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mobspy"
version = "2.8.0"
description = "A Query-Based Language for Chemical Reaction Networks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["CRN", "microbiology", "synthetic biology", "simulation", "SBML", "specification language"]
dependencies = [
    "matplotlib",
    "numpy",
    "python-copasi<=4.44.295",
    "python-libsbml",
    "scipy",
    "pandas",
    "joblib",
    "tqdm",
    "copasi-basico",
    "pint",
]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[project.urls]
Repository = "https://github.com/ROBACON/mobspy"
Documentation = "https://mobspy-doc.readthedocs.io/en/latest/"

[tool.setuptools.packages.find]
include = ["mobspy", "mobspy.*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "slow: tests that run simulations (may take a while)",
    "compilation: tests that only compile models (fast)",
]
